<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0c14">
<title>justrain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Root screen: radial night sky, breathing glow, rain canvas, vignette, then the UI column. -->
<div id="screen">
  <div id="glow"></div>
  <canvas id="rain"></canvas>
  <div id="vignette"></div>

  <div id="ui">
    <!-- top bar -->
    <div class="topbar">
      <div class="spacer"></div>
      <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-word">petrichor</div>
      </div>
      <div id="gearWrap" class="gear-wrap">
        <button id="gearBtn" class="icon-btn" aria-label="settings">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.9" stroke="rgba(233,233,237,.6)" stroke-width="1.2"></circle><path d="M10 1.8v2.1M10 16.1v2.1M18.2 10h-2.1M3.9 10H1.8M15.8 4.2l-1.5 1.5M5.7 14.3l-1.5 1.5M15.8 15.8l-1.5-1.5M5.7 5.7L4.2 4.2" stroke="rgba(233,233,237,.6)" stroke-width="1.2" stroke-linecap="round"></path></svg>
        </button>
      </div>
    </div>

    <!-- center -->
    <div class="center">
      <div id="stateWord" class="state-word">raining</div>
      <div class="time-block">
        <div id="bigTime" class="big-time">0:00</div>
        <div id="bigLabel" class="big-label">raining for</div>
      </div>
      <button id="playBtn" class="play-btn" aria-label="play/pause">
        <svg id="pauseIcon" width="26" height="30" viewBox="0 0 26 30" fill="none"><rect x="1" y="1" width="8" height="28" rx="2.5" fill="#d2cefd"></rect><rect x="17" y="1" width="8" height="28" rx="2.5" fill="#d2cefd"></rect></svg>
        <svg id="playIcon" width="28" height="30" viewBox="0 0 28 30" fill="none" style="display:none"><path d="M4 2.6c0-1.6 1.7-2.6 3.1-1.8l18 12.4c1.3.8 1.3 2.7 0 3.5l-18 12.4C5.7 29.9 4 28.9 4 27.4V2.6z" fill="#d2cefd"></path></svg>
      </button>
    </div>

    <!-- chrome: volume + thunder + timer -->
    <div id="chrome" class="chrome">
      <div class="vol-row">
        <svg width="16" height="14" viewBox="0 0 16 14" fill="none" class="vol-ico"><path d="M1 5h3l4-3.4v10.8L4 9H1V5z" stroke="#e9e9ed" stroke-width="1.2" stroke-linejoin="round"></path></svg>
        <div id="volTrack" class="vol-hit">
          <div class="vol-rail">
            <div id="volFill" class="vol-fill"></div>
            <div id="volKnob" class="vol-knob"></div>
          </div>
        </div>
      </div>

      <button id="thunderRow" class="row row-thunder">
        <span class="row-label">
          <svg width="15" height="16" viewBox="0 0 16 18" fill="none"><path d="M9.2 1L3 9.8h4L6.6 17l6.4-9.2H8.7L9.2 1z" stroke="#9184d9" stroke-width="1.2" stroke-linejoin="round"></path></svg>
          thunder
        </span>
        <span id="thunderTrack" class="switch"><span id="thunderKnob" class="switch-knob"></span></span>
      </button>

      <button id="timerRow" class="row row-timer">
        <span class="row-label">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8.6" r="6.4" stroke="#9184d9" stroke-width="1.2"></circle><path d="M8 5.2v3.6l2.4 1.5" stroke="#9184d9" stroke-width="1.2" stroke-linecap="round"></path></svg>
          <span id="timerWord">rain until…</span>
        </span>
        <span id="timerVal" class="timer-val">off</span>
      </button>
    </div>
  </div>

  <!-- sheets -->
  <div id="backdrop" class="backdrop"></div>

  <div id="timerSheet" class="sheet">
    <div class="grip"></div>
    <div class="sheet-title" id="timerSheetTitle">rain until…</div>
    <div class="sheet-sub">the rain thins out over the last minute, then stops.</div>
    <div id="timerList" class="sheet-list"></div>
  </div>

  <div id="settingsSheet" class="sheet">
    <div class="grip"></div>
    <div class="sheet-title">settings</div>
    <div class="sheet-sub">four switches. that is the whole app.</div>
    <div id="settingsList" class="sheet-list"></div>
    <div class="sheet-footer">petrichor · 1.0</div>
    <div class="sheet-credit">rain by Argande102 · <a href="https://freesound.org/s/170438/" target="_blank" rel="noopener">freesound</a> · CC-BY-3.0</div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
