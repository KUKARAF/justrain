[package]
name = "justrain"
version = "1.0.0"
description = "justrain — a calm rain sound app"
authors = ["KUKARAF"]
edition = "2021"

# The library is what the Android/iOS wrappers link against.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-native-player = { path = "./plugins/tauri-plugin-native-player" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
