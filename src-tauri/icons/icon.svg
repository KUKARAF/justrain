<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="t d">
  <title id="t">justrain</title>
  <desc id="d">Five falling rain streaks, leaning like the app's own rain animation, on a deep night-blue ground.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="12%" r="98%">
      <stop offset="0%" stop-color="#20233a"/>
      <stop offset="46%" stop-color="#12142400"/>
      <stop offset="46%" stop-color="#121424"/>
      <stop offset="100%" stop-color="#080910"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="56%" r="42%">
      <stop offset="0%" stop-color="#9184d9" stop-opacity="0.60"/>
      <stop offset="45%" stop-color="#9184d9" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#9184d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="34%" y1="6%" x2="66%" y2="100%">
      <stop offset="0%" stop-color="#f6f7ff"/>
      <stop offset="44%" stop-color="#d2cefd"/>
      <stop offset="100%" stop-color="#8f82d8"/>
    </linearGradient>
    <clipPath id="round"><rect width="1024" height="1024" rx="220"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="#0b0c14"/>
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="600" r="360" fill="url(#glow)"/>
    <g transform="translate(97.1,223.9) scale(3.6)" stroke="url(#drop)" stroke-linecap="round" fill="none">
      <line x1="40" y1="20" x2="54.6" y2="88.5" stroke-opacity="0.4" stroke-width="10"/>
      <line x1="75" y1="10" x2="97.9" y2="117.6" stroke-opacity="0.62" stroke-width="12"/>
      <line x1="110" y1="30" x2="141.2" y2="176.7" stroke-opacity="0.95" stroke-width="14"/>
      <line x1="148" y1="15" x2="167.8" y2="107.9" stroke-opacity="0.58" stroke-width="11"/>
      <line x1="178" y1="40" x2="190.5" y2="98.7" stroke-opacity="0.38" stroke-width="9"/>
    </g>
  </g>
</svg>
